name: ci

# push / PR 只做快速验证：确认 media_core 的 git 依赖能被解析。
# 真正打 release APK 由 dart.yml 在推送 v* 标签时执行：默认只发 impeller ×
# armeabi-v7a / arm64-v8a 共 2 个包（Skia 兼容版改为手动按需构建）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: '额外编译一个 debug APK 做完整编译验证'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "21"

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 打印工具链版本
        run: flutter --version

      # 这一步是本 CI 的核心：pubspec.yaml 里的 10 个 media_core_* 包已从
      # 作者本机的 F:/media_core 绝对路径改为固定 commit 的 git 依赖，
      # 只要这一步通过，clone 本仓库到任意机器都能还原依赖。
      - name: 解析依赖
        run: flutter pub get

      # 上游仓库本身带少量 analyzer 提示，这里只产出诊断日志、不阻断流水线。
      - name: 静态分析（诊断用，不阻断）
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # TVBox 解析层的回归网。只跑这一个文件：其余测试依赖 freezed/hive 的
      # 生成产物，CI 里没有 build_runner 阶段，跑全量会误报。
      # 这里不 continue-on-error —— 解析错一处，导入的整个 TVBox 源都会失效。
      - name: TVBox 解析层单测
        run: flutter test test/vod_parser_test.dart

      # 预热 ffmpeg 的 build hook。
      # ffmpeg_kit_extended_flutter 用 Dart build hook 在编译期下载 aar 到
      # .dart_tool/hooks_runner/…。冷缓存时这次下载发生在 kernel_snapshot
      # 期间，Flutter 检测到输入文件被改写，直接抛
      # 「File modified during build. Build must be rerun.」并失败 ——
      # 不是代码问题，是 hook 与快照的竞态。
      # 先跑一次 --config-only 把 aar 落进缓存，正式编译就不会再动文件。
      # continue-on-error：万一某个 Flutter 版本不支持该参数，也不要因此拦住构建。
      - name: 预热原生依赖（ffmpeg build hook）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' }}
        continue-on-error: true
        run: flutter build apk --debug --flavor impeller --target-platform android-arm64 --config-only

      # 手动触发时可选：真正编译一次，提前暴露 Dart / Gradle 编译错误，
      # 避免为了验证构建而白白发布一个 Release。
      # 失败后重试一次：即使预热没生效，第二次编译时 aar 已在缓存里。
      - name: 完整编译验证（debug APK）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' }}
        run: |
          flutter build apk --debug --flavor impeller --target-platform android-arm64 \
            || flutter build apk --debug --flavor impeller --target-platform android-arm64
