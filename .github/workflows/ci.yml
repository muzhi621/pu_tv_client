name: ci

# push / PR 只做快速验证：确认 media_core 的 git 依赖能被解析。
# 真正打 release APK 由 dart.yml 在推送 v* 标签时执行：默认只发 impeller ×
# armeabi-v7a / arm64-v8a 共 2 个包（Skia 兼容版改为手动按需构建）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: '额外编译一个 debug APK 做完整编译验证'
        type: boolean
        default: false
      diag:
        description: '只跑 Gradle 类路径诊断，跳过 APK 编译'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "21"

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Chaquopy（#64）的 buildPython 必须与 app 的 Python 版本一致，
      # 否则 pip / pyc 编译会直接报版本不匹配。app 侧锁定 3.10（3.11 及更早
      # 才支持 armeabi-v7a，而本项目要发 v7a 包）。
      - name: 设置构建机 Python（Chaquopy buildPython）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 打印工具链版本
        run: flutter --version

      # 这一步是本 CI 的核心：pubspec.yaml 里的 10 个 media_core_* 包已从
      # 作者本机的 F:/media_core 绝对路径改为固定 commit 的 git 依赖，
      # 只要这一步通过，clone 本仓库到任意机器都能还原依赖。
      - name: 解析依赖
        run: flutter pub get

      # 上游仓库本身带少量 analyzer 提示，这里只产出诊断日志、不阻断流水线。
      - name: 静态分析（诊断用，不阻断）
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # TVBox 解析层的回归网。只跑这一个文件：其余测试依赖 freezed/hive 的
      # 生成产物，CI 里没有 build_runner 阶段，跑全量会误报。
      # 这里不 continue-on-error —— 解析错一处，导入的整个 TVBox 源都会失效。
      - name: TVBox 解析层单测
        run: flutter test test/vod_parser_test.dart

      # 手动触发时可选：按发版同样的方式编译一次，提前暴露 Dart / Kotlin /
      # Java / R8 的错误，避免为了验证构建而白白发布一个 Release。
      #
      # 为什么用 --release 而不是 --debug：
      # 发版走的就是 release（R8 开启），验证它对得上真实产物。
      # debug 分支曾因 catvod-api.jar 缺嵌套类 Decoder$Content 在 D8 阶段失败，
      # 现已由 src/main/java/com/github/catvod/utils/Decoder$Content.java 补上；
      # 这里仍统一用 release，避免两条路径给出不同结论。
      # 没有 release 签名时 build.gradle.kts 自动回退 debug 签名，CI 无需密钥。
      #
      # 日志里会看到若干次 “File modified during build. Build must be rerun.”，
      # 来自 ffmpeg_kit_extended_flutter 的 build hook 下载 aar，Flutter 会自动
      # 重跑该阶段，不影响结果。
      - name: 完整编译验证（release APK，与发版同构）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' }}
        run: >
          flutter build apk --release --flavor impeller --target-platform android-arm64
          --android-skip-build-dependency-validation

      # 临时排查步骤：Kotlin 编译期解析不到 implementation 里的 okhttp3 /
      # catvod-api.jar（javac 阶段却正常），先把 variant 的真实类路径打出来。
      - name: 诊断 Kotlin 编译类路径
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (github.event.inputs.full_build == 'true' || github.event.inputs.diag == 'true') }}
        continue-on-error: true
        working-directory: android
        run: |
          set +e
          run_case() {
            echo "########## $1"
            cp "$2" app/build.gradle.kts
            ./gradlew -q :app:dependencyInsight \
              --configuration impellerReleaseCompileClasspath --dependency okhttp 2>&1 | head -12
            ./gradlew -q :app:dependencyInsight \
              --configuration impellerReleaseCompileClasspath --dependency catvod 2>&1 | head -6
          }
          run_case "C 保留 chaquopy_java 依赖，去掉插件/ndk/chaquopy 块" app/build_diag_c.gradle.kts
          run_case "B 保留插件，去掉 chaquopy_java 依赖" app/build_diag_b.gradle.kts

      # 体积是 #64 的硬指标（用户批准上限 ~72 MB），所以把账算在日志里：
      # 整体体积、Python 相关条目（chaquopy 标准库 + libpython）、native 库。
      - name: 统计 APK 体积与 Python 占比
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' }}
        run: |
          set -e
          ls -l build/app/outputs/flutter-apk/*.apk || true
          apk=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "===== $apk ====="
          unzip -l "$apk" | awk '/chaquopy/ {s+=$1; n++} END {printf "chaquopy 条目 %d 个，合计 %.2f MB\n", n, s/1048576}'
          unzip -l "$apk" | awk '/libpython|libchaquopy/ {s+=$1; n++} END {printf "python native %d 个，合计 %.2f MB\n", n, s/1048576}'
          unzip -l "$apk" | awk '/lib\/arm64-v8a\// {s+=$1; n++} END {printf "arm64 native %d 个，合计 %.2f MB\n", n, s/1048576}'
          unzip -l "$apk" | awk '/assets\/flutter/ {s+=$1} END {printf "flutter assets %.2f MB\n", s/1048576}'
