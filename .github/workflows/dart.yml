name: build-android-Tv

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (leave empty to use the version in assets/version.json)'
        required: false
        default: ''
      ref:
        description: 'Branch or tag to build (leave empty to use the triggering ref)'
        required: false
        default: ''
      include_skia:
        description: '额外构建 Skia 兼容版（仅当 Impeller 画面异常/黑屏时勾选）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# One release per tag: a second run for the same tag waits instead of racing
# the first one's APK upload against the same GitHub release.
concurrency:
  group: android-tv-release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    # Android only: nothing here needs the macOS toolchain, and a Linux runner
    # costs a tenth of a macOS minute and is usually faster for Gradle.
    runs-on: ubuntu-latest
    # One renderer flavor x two ABIs with R8 on a cold Gradle cache can take
    # well over an hour on a fresh runner; keep a hard ceiling but give the
    # first release build enough room to finish.
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The tag is what the download paths are built from, so it is resolved before
      # anything is built: a tag push uses its own tag, and a manual run that typed
      # no tag falls back to assets/version.json instead of republishing the stale
      # default this workflow used to carry.
      - name: 解析发布标签
        id: meta
        run: |
          tag="${{ github.event.inputs.tag_name }}"
          if [ -z "$tag" ]; then
            case "${{ github.ref }}" in
              refs/tags/*) tag="${{ github.ref_name }}" ;;
              *) tag="v$(jq -r '.version' assets/version.json)" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布标签：$tag"

      # 签名密钥是可选的。android/app/build.gradle.kts 在缺少 key.properties 时
      # 会回退到 debug key，因此 fork 后不配置任何 secrets 也能构建出可安装的 APK；
      # 配置了则使用自己的 release 签名。
      - name: 配置Release签名（未配置密钥则回退debug签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/key.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$GITHUB_WORKSPACE/android/key.jks" "$STORE_PASSWORD" \
              "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "已启用 Release 签名"
          else
            echo "::notice::未配置 KEYSTORE_BASE64，本次使用 debug 签名（build.gradle.kts 自动回退）"
          fi

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "21"
          cache: 'gradle'

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 更新Flutter的packages
        run: flutter pub get

      # 电视盒子绝大多数是 32 位系统（armeabi-v7a），少数 64 位系统设备用
      # arm64-v8a；x86_64 只服务模拟器与极少数 x86 盒子，不再发布。
      #
      # 云端配置地址与只读令牌通过 dart-define 编译进包：地址有代码内默认值，
      # 令牌放 GitHub Secret（不写进公开仓库），未配置时为空 = 不发 Authorization 头。
      - name: 打包APK（Impeller 渲染器，默认唯一产物）
        run: >
          flutter build apk --release --flavor impeller --split-per-abi
          --target-platform android-arm,android-arm64
          --android-skip-build-dependency-validation --obfuscate --split-debug-info=${{ runner.temp }}/pu_tv_symbols
          --dart-define=PURE_LIVE_CONFIG_URL=${{ vars.PURE_LIVE_CONFIG_URL || 'https://tv.1008618.xyz' }}
          --dart-define=PURE_LIVE_CONFIG_TOKEN=${{ secrets.PURE_LIVE_CONFIG_TOKEN }}

      # Skia 仅作兼容兜底：tag 发版不构建，手动触发时勾选 include_skia 才出包。
      - name: 打包APK（Skia 渲染器，按需）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_skia == 'true' }}
        run: >
          flutter build apk --release --flavor skia --split-per-abi
          --target-platform android-arm,android-arm64
          --android-skip-build-dependency-validation --obfuscate --split-debug-info=${{ runner.temp }}/pu_tv_symbols
          --dart-define=PURE_LIVE_CONFIG_URL=${{ vars.PURE_LIVE_CONFIG_URL || 'https://tv.1008618.xyz' }}
          --dart-define=PURE_LIVE_CONFIG_TOKEN=${{ secrets.PURE_LIVE_CONFIG_TOKEN }}

      - name: 重命名 APK 文件
        run: |
          cd build/app/outputs/flutter-apk/
          count=0
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi=$(echo "$f" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64' | head -1)
            if echo "$f" | grep -q 'skia'; then renderer='skia'; else renderer='impeller'; fi
            mv "$f" "PureLive-TV-${abi}-${renderer}.apk"
            count=$((count + 1))
          done
          echo "==== 本次产物 ===="
          ls -lh PureLive-TV-*.apk
          # A build whose artifacts are not named as expected must fail here, not
          # publish a release with nothing in it.
          if [ "$count" -eq 0 ]; then
            echo "::error::没有找到 release APK，产物命名与预期不符"
            exit 1
          fi

      # 体积归因：把每个 APK 里最大的条目写进运行摘要，后续瘦身可精确对比，
      # 不必下载 100 MB 的 APK 或抓 ZIP 中央目录。
      - name: 输出 APK 体积清单
        run: |
          {
            echo "## 📊 APK 体积清单（按条目大小倒序，前 25 项）"
            echo ""
            for f in build/app/outputs/flutter-apk/PureLive-TV-*.apk; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f") · $(du -h "$f" | cut -f1)"
              echo '```'
              unzip -l "$f" | sort -k1,1nr | head -25
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 读取版本信息
        id: version
        run: |
          delim="EOF_${RANDOM}${RANDOM}"
          {
            echo "desc<<$delim"
            jq -r '.version_desc' assets/version.json
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Also on the run page: the release is the only place these APKs could be
      # downloaded from, so a failed release step left the build with nowhere to go.
      - name: 上传 APK 产物（运行页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-TV-${{ steps.meta.outputs.tag }}
          path: build/app/outputs/flutter-apk/PureLive-TV-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传至Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            📦 纯粹直播 ${{ steps.meta.outputs.tag }}
            本次更新内容：
            ${{ steps.version.outputs.desc }}
            📺 版本说明：
            • 默认只发布 **Impeller 渲染器**；若画面异常/黑屏，可手动触发构建并勾选 include_skia 单独生成 Skia 兼容版
            • **armeabi-v7a：绝大多数电视盒子（32 位系统），推荐先装这个**
            • arm64-v8a：仅 64 位系统设备（如 NVIDIA Shield、部分新旗舰）
            • 不再发布 x86_64（只用于模拟器）
            • 不确定选哪个：adb shell getprop ro.product.cpu.abilist，列表含 arm64-v8a 才用 arm64 包

            本软件为开源项目,无广告，无病毒，若安装时出现病毒误报，可自行斟酌。
          prerelease: false
          files: build/app/outputs/flutter-apk/PureLive-TV-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every download path in one place on the run page: the release page,
      # the APK URLs, and this run's artifacts.
      - name: 汇总下载路径
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          {
            echo "## 📦 $tag 下载路径"
            echo ""
            for f in build/app/outputs/flutter-apk/PureLive-TV-*.apk; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              echo "- [$name]($base/$name) · $(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "- Release 页面：https://github.com/${{ github.repository }}/releases/tag/$tag"
            echo "- 本次运行的构建产物：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 输出任务状态
        if: always()
        run: echo "🍏 Build status is ${{ job.status }}."

  # The app reads its download paths from assets/releases.json, and that index only
  # lists a release once it exists. This refreshes it after the APKs are published by
  # calling the manual index workflow instead of copying its steps, so the two cannot
  # drift apart.
  update-release-index:
    needs: build-android
    permissions:
      contents: write
    uses: ./.github/workflows/build_release.yml
